{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link type="text/css" href="{% static 'styles/style.css' %}" rel="stylesheet" />
    <link type="x-icon" href="{% static 'img/logo.jpg' %}" rel="icon" />
    <script lang="javascript" src="{% static 'js/circularProgressBar.js' %}"></script>
</head>
<body>
    <main>
        <div class="scalfold">
            <div class="topbar">
                <h2>Upload</h2>
            </div>
            <div class="body">

        <div class="form_container">
            <h3>Upload Students for {{ upload_class}} </h3>
                
            <form method="post"  enctype="multipart/form-data">
                {% csrf_token %}
                {{ upload_form.as_p }}
                <center>
                    <button class="pry-btn" type="submit">Upload Students</button>
                </center>
            </form>
        
        </div>
            

        </div>
    </main>
</body>
</html>
