{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link type="text/css" href="{% static 'styles/style.css' %}" rel="stylesheet" />
    <link type="x-icon" href="{% static 'img/logo.jpg' %}" rel="icon" />
    <script lang="javascript" src="{% static 'js/circularProgressBar.js' %}"></script>
</head>
<body>
    <main>
        <div class="scalfold">
            <div class="topbar">
                <h2>Dashboard</h2>
            </div>
            <div class="body">
                <div class="dashboard-tab">
                    <div class="tab-item" style="display: flex; align-items: center;">


                    <div class="circular-progress" role="progressbar" aria-valuemin="0" aria-valuemax="25" aria-valuenow="0" data-value="{{ total_progress_percentage }}" id="cprog-1">
                        <svg viewBox="0 0 120 120" class="cprog-ring" aria-hidden="true">
                            <circle class="bg" cx="60" cy="60" r="52" />
                        </svg>
                        <div class="cprog-fill" aria-hidden="true"></div>
                        <div class="cprog-center">
                            <span class="cprog-text">..%</span>
                        </div>
                    </div>


                    </div>
                    <div class="tab-item">
                        <h3>All Insights</h3>
                        <h4>{{ total_captured_students }}/{{ total_students }}</h4>
                        <!-- <a>Upload class</a> -->
                    </div>
                </div>
                <div class="spacer-h" ></div>
                <div class="grid-container">
                    {% for class in classes %}
                    <a href="{% url 'facesnapper:student_list' class.id %}">
                        <div class="grid-item">
                            <h3>{{ class.tag }}</h3>
                            <h4>
                                {% if class.total_students > 0 %}
                                    {{ class.captured_students }}/{{ class.total_students }}
                                {% else %}
                                    0/0
                                {% endif %}
                            </h4>
                        </div>
                    </a>
                    {% endfor %}
        
                </div>
            </div>
            

        </div>
    </main>
</body>
</html>
