<div class="circular-progress" role="progressbar" aria-valuemin="0" aria-valuemax="25" aria-valuenow="0" data-value="15" id="cprog-1">
  <svg viewBox="0 0 120 120" class="cprog-ring" aria-hidden="true">
    <circle class="bg" cx="60" cy="60" r="52" />
  </svg>
  <div class="cprog-fill" aria-hidden="true"></div>
  <div class="cprog-center">
    <span class="cprog-text">..%</span>
  </div>
</div>

<style>
/* --- sizing & layout --- */
.circular-progress {
  width: 120px;
  height: 120px;
  position: relative;
  font-family: system-ui, sans-serif;
  --size: 120px;
  --thickness: 12px;
  --bg: #e6e6e6;
  --accent: #3b82f6; /* default accent color */
  display: inline-block;
}

/* background ring (SVG circle) */
.cprog-ring { 
  width: 100%;
  height: 100%;
  transform: rotate(-90deg); /* start at top */
  position: absolute;
  left: 0;
  top: 0;
}
.cprog-ring .bg {
  fill: none;
  stroke: var(--bg);
  stroke-width: var(--thickness);
}

/* colored arc using conic-gradient inside a pseudo-element area */
.cprog-fill {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  padding: var(--thickness);
  box-sizing: border-box;
  background: conic-gradient(var(--accent) 0deg, transparent 0deg);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - var(--thickness)), black calc(100% - var(--thickness)));
  mask: radial-gradient(farthest-side, transparent calc(100% - var(--thickness)), black calc(100% - var(--thickness)));
  transition: background 400ms linear;
}

/* inner circle (background) */
.cprog-center {
  position: absolute;
  inset: calc(var(--thickness) + 4px);
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: white;
  box-sizing: border-box;
  text-align: center;
}

/* text */
.cprog-text {
  font-weight: 600;
  font-size: 1rem;
  line-height: 1;
}

/* small responsive tweak */
@media (max-width: 420px) {
  .circular-progress { width: 96px; height: 96px; }
}
</style>

<script>
/**
 * Circular Progress component utilities
 * - initProgress(element) : reads data-value or aria-valuenow and paints the conic-gradient.
 * - setProgress(element, value) : sets value (0-100), updates aria, and animates.
 */

function _clamp(n, a=0, b=100){ return Math.min(b, Math.max(a, n)); }

function setProgress(el, value) {
  value = _clamp(Math.round(value));
  // 360 * (value / 100)
  const deg = (360 * value) / 100;
  // set CSS conic gradient stop to deg
  el.querySelector('.cprog-fill').style.background = `conic-gradient(var(--accent) ${deg}deg, transparent ${deg}deg)`;
  // update text + ARIA
  const text = el.querySelector('.cprog-text');
  if (text) text.textContent = `${value}%`;
  el.setAttribute('aria-valuenow', String(value));
  el.dataset.value = String(value);
}

function initProgress(el) {
  // prefer data-value if provided otherwise aria-valuenow
  let initial = parseFloat(el.dataset.value ?? el.getAttribute('aria-valuenow') ?? 0);
  if (isNaN(initial)) initial = 0;
  setProgress(el, initial);
  // keep CSS var for color from style attribute if set inline
  const accent = el.style.getPropertyValue('--accent');
  if (accent) el.querySelector('.cprog-fill').style.setProperty('--accent', accent);
}

// auto-init any .circular-progress on page
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.circular-progress').forEach(initProgress);
});
</script>
